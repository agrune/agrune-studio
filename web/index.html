<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrune Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">◇</div>
          <div>
            <div class="brand-name">Agrune Studio</div>
            <div class="brand-sub">self-healing E2E QA</div>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
          <span class="dot" id="health-dot"></span>
          <span id="health-text">engine ready</span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 id="panel-title">Scenarios</h1>
          <p id="panel-desc" class="muted"></p>
        </header>
        <section id="panel" class="panel"></section>
      </main>
    </div>
    <div id="lightbox" class="lightbox hidden"><img id="lightbox-img" alt="screenshot" /></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
